<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开放康熙字典体 · 校勘台</title>
<style>
@font-face{font-family:KX;src:url('../fonts/OFLKangxi-Regular.woff2')}*{box-sizing:border-box}body{margin:0;color:#292a26;background:#f1efe7;font:15px system-ui}header{padding:30px max(22px,calc((100vw - 1440px)/2));background:#faf9f3;border-bottom:1px solid #c8c2b5}h1{font:32px serif;margin:0 0 8px}p{line-height:1.7}.eyebrow{font-size:12px;letter-spacing:.15em;color:#88764d}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}input,select,button{padding:9px 12px;border:1px solid #b7b2a3;border-radius:4px;background:#fffdf7;font:inherit;color:inherit}button{cursor:pointer}a{color:#665632}.stats{margin:15px 0 0;font-variant-numeric:tabular-nums}main{max-width:1484px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}.card{background:#fffdf7;border:1px solid #cfc8b9;border-top:3px solid #af7b36;padding:18px}.card[data-status=ok]{border-top-color:#63846b}.card[data-status=issue]{border-top-color:#b14436}.heading{display:flex;justify-content:space-between;align-items:baseline}.char{font:40px KX,serif}.cp{font:12px ui-monospace;color:#747166}.images{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.images img{width:100%;height:170px;object-fit:contain;background:white}.sample{font:132px KX;text-align:center;height:170px;line-height:170px;background:linear-gradient(90deg,transparent 49.7%,#ece7dc 49.7%,#ece7dc 50.3%,transparent 50.3%),linear-gradient(transparent 49.7%,#ece7dc 49.7%,#ece7dc 50.3%,transparent 50.3%),white}.caption{font-size:12px;color:#7a7668;margin-top:4px}.context{width:100%;height:250px;object-fit:contain;background:#e7dfcb;cursor:zoom-in}.tags{min-height:40px;font-size:12px;line-height:1.8;color:#9a652d}.meta{font-size:12px;line-height:1.8;color:#666053}.card select{width:100%;margin-top:12px}.card textarea{width:100%;height:50px;margin-top:8px;background:#faf9f3;border:1px solid #d4cdbc;padding:6px;font:13px system-ui}footer{padding:25px;text-align:center}.loading{color:#9a652d}
</style><header><div class="eyebrow">OFL KANGXI / EDITORIAL REVIEW</div><h1>开放康熙字典体 · 校勘台</h1><p>本轮 1,170 条标记记录已完成用户校对。部分字形仍残有划痕笔画，未做进一步清理。原始字图、原书位置与字体结果并列，可继续记录“保留”或“需修订”，可导出校勘记录。<a href="index.html">查看横竖排样张 →</a></p><div class="bar"><input id="q" placeholder="搜汉字、Unicode、位置 ID"><select id="tag"><option value="">全部复核条目</option></select><select id="status"><option value="">全部状态</option><option value="reviewed">本轮已校对</option><option value="pending">需要再次核对</option><option value="ok">确认保留</option><option value="issue">需要修订</option></select><button id="export">导出记录</button><button id="import">导入记录</button><input type="file" id="file" accept="application/json" hidden></div><div class="stats" id="stats"></div><p class="caption">框线标示原切分记录的近似字区；“玄”保留避讳缺笔。相似度低仅是复核信号，不代表必须改为现代字形。原书：哈佛大学图书馆藏本，经书格分享。</p></header><main id="grid"></main><footer><button id="more">显示下一批</button><p id="fontstate" class="caption loading">字体载入中</p></footer><script src="review-data.js"></script><script>
const $=x=>document.getElementById(x),key='kangxi1716-review-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let limit=36;
const counts={};for(const r of REVIEW)for(const t of r.review_tags)counts[t]=(counts[t]||0)+1;for(const [t,n] of Object.entries(counts)){const o=document.createElement('option');o.value=t;o.textContent=t+' · '+n;$('tag').append(o)}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function render(){const q=$('q').value.trim().toLowerCase(),t=$('tag').value,s=$('status').value;const rows=REVIEW.filter(r=>(!t||r.review_tags.includes(t))&&(!q||[r.字,r.Unicode,r.id].some(x=>x.toLowerCase().includes(q)))&&(!s||(state[r.id]?.status||'reviewed')===s));$('grid').replaceChildren();for(const r of rows.slice(0,limit)){const a=document.createElement('article');a.className='card';a.dataset.status=state[r.id]?.status||'reviewed';const head=document.createElement('div');head.className='heading';const ch=document.createElement('span');ch.className='char';ch.textContent=r.字;const cp=document.createElement('span');cp.className='cp';cp.textContent=r.Unicode+' / '+r.id;head.append(ch,cp);a.append(head);const ims=document.createElement('div');ims.className='images';const raw=document.createElement('div');const im=document.createElement('img');im.src=r.png;im.alt=r.字+'原始PNG';raw.append(im);const cap=document.createElement('div');cap.className='caption';cap.textContent='原始 PNG';raw.append(cap);const fo=document.createElement('div');const samp=document.createElement('div');samp.className='sample';samp.textContent=r.字;const fc=document.createElement('div');fc.className='caption';fc.textContent='字体 / 固定字框';fo.append(samp,fc);ims.append(raw,fo);a.append(ims);const ctx=document.createElement('img');ctx.className='context';ctx.loading='lazy';ctx.alt=r.字+'原书局部';ctx.src='context/'+r.id+'.jpg';ctx.onclick=()=>window.open(ctx.src,'_blank');a.append(ctx);const tags=document.createElement('p');tags.className='tags';tags.textContent=r.review_tags.join(' · ');a.append(tags);const meta=document.createElement('div');meta.className='meta';meta.textContent=r.册+' '+r.集+' / PDF '+r.PDF页+' 页 '+r.面+'面第'+r['行(自右)']+'行 / 相似度 '+r.字形相似度+' / '+r.类别;a.append(meta);const sel=document.createElement('select');for(const [v,tx] of [['reviewed','本轮已校对'],['pending','需要再次核对'],['ok','确认保留原貌'],['issue','需要修订']]){const o=document.createElement('option');o.value=v;o.textContent=tx;sel.append(o)}sel.value=state[r.id]?.status||'reviewed';const note=document.createElement('textarea');note.placeholder='校勘备注';note.value=state[r.id]?.note||'';function update(){state[r.id]={status:sel.value,note:note.value,source_sha256:r.sha256,updated:new Date().toISOString()};a.dataset.status=sel.value;save()}sel.onchange=update;note.oninput=update;a.append(sel,note);$('grid').append(a)}$('stats').textContent='筛选 '+rows.length+' / 复核 '+REVIEW.length+' 条；本轮已校对 '+REVIEW.filter(r=>!state[r.id]||state[r.id].status!=='pending').length+' 条；显示 '+Math.min(limit,rows.length)+' 条';$('more').hidden=rows.length<=limit}
for(const id of ['q','tag','status'])$(id).oninput=()=>{limit=36;render()};$('more').onclick=()=>{limit+=36;render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({project:'OFL Kangxi',version:1,records:state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kangxi1716-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const d=JSON.parse(await $('file').files[0].text());if(d.project!=='OFL Kangxi')throw Error('项目不匹配');const ids=new Set(REVIEW.map(r=>r.id));for(const [id,r]of Object.entries(d.records||{}))if(ids.has(id)&&['reviewed','pending','ok','issue'].includes(r.status))state[id]={status:r.status,note:String(r.note||''),source_sha256:r.source_sha256};save();render()}catch(e){alert('无法导入：'+e.message)}};$('tag').value='位置推定';render();document.fonts.load('24px KX').then(()=>{$('fontstate').textContent='OFL Kangxi 字体已载入';$('fontstate').className='caption'}).catch(()=>$('fontstate').textContent='字体未载入，请从本地服务器打开');
</script><script src="editor.js"></script></html>
